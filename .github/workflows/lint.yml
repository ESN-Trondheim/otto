# This workflow verifies project files are formatted according to Black and isort, using the versions locked in uv.lock

name: Lint
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Check formatting with Black
        run: uv run black --check --diff .
  isort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Check imports with isort
        run: uv run isort --check-only --diff .
