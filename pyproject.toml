[project]
name = "otto"
version = "1.0.0"
description = "Slackbot for ESN Trondheim"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arrow>=1.4.0",
    "flask>=3.1.3",
    "html2image>=2.0.7",
    "jinja2>=3.1.6",
    "peewee>=4.5.3",
    "pillow>=13.0.0",
    "psycopg2>=2.9.13",
    "python-dotenv>=1.2.4",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "slack-bolt>=1.30.0",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=otto --cov-report=term-missing"

[tool.isort]
profile = "black"
